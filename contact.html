<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Lost & Found Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">RecoverPortal</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse Items</a></li>
        <li><a href="report-lost.html">Report Lost</a></li>
        <li><a href="report-found.html">Report Found</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div style="max-width: 600px; margin: 0 auto; background: var(--white); padding: 2rem; border: 1px solid var(--border); border-radius: 0.5rem;">
      <h2>Contact Support</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem;">Have questions or need assistance recovering a high-value item? Reach out to our team.</p>
      
      <form>
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Stupid32Mai" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Mol@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="How can WE help you?" required></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; By Thanon</p>
  </footer>
</body>
</html>
